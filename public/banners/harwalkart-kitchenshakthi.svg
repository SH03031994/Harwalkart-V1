<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <!-- Background Gradient: Warm Kitchen Interior Tone -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#EBE3D5"/>
      <stop offset="45%" stop-color="#D7CCC0"/>
      <stop offset="65%" stop-color="#C2A888"/>
      <stop offset="100%" stop-color="#8C5828"/>
    </linearGradient>

    <!-- Wood Table Gradient -->
    <linearGradient id="tableGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#DEB887"/>
      <stop offset="25%" stop-color="#CD853F"/>
      <stop offset="75%" stop-color="#A0522D"/>
      <stop offset="100%" stop-color="#6F3714"/>
    </linearGradient>

    <!-- Metallic Gold Brand Text Gradient -->
    <linearGradient id="goldGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFDF0"/>
      <stop offset="20%" stop-color="#FFE144"/>
      <stop offset="50%" stop-color="#FFB300"/>
      <stop offset="80%" stop-color="#E67300"/>
      <stop offset="100%" stop-color="#994D00"/>
    </linearGradient>

    <!-- Black Metallic Gradient -->
    <linearGradient id="blackMetalGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3A3A3A"/>
      <stop offset="40%" stop-color="#1A1A1A"/>
      <stop offset="70%" stop-color="#0A0A0A"/>
      <stop offset="100%" stop-color="#2D2D2D"/>
    </linearGradient>

    <!-- Red Chilli Gradient -->
    <linearGradient id="redGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FF3333"/>
      <stop offset="50%" stop-color="#D60000"/>
      <stop offset="100%" stop-color="#800000"/>
    </linearGradient>

    <!-- Turmeric Gradient -->
    <linearGradient id="turmericGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFE033"/>
      <stop offset="50%" stop-color="#FFB000"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>

    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="4" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <filter id="glowGold" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background: Kitchen Ambient -->
  <rect width="1920" height="1080" fill="url(#bgGrad)"/>
  
  <!-- Subtle Kitchen Depth Blur Shapes -->
  <rect x="0" y="0" width="1920" height="650" fill="#E8DFD0" opacity="0.6"/>
  <rect x="200" y="80" width="500" height="300" rx="16" fill="#D3C7B5" opacity="0.4"/>
  <rect x="1200" y="100" width="600" height="350" rx="16" fill="#D3C7B5" opacity="0.3"/>
  <circle cx="960" cy="520" r="140" fill="#FF4422" opacity="0.4" filter="url(#glowGold)"/>

  <!-- Wooden Kitchen Counter Surface -->
  <rect x="0" y="660" width="1920" height="420" fill="url(#tableGrad)"/>
  <line x1="0" y1="660" x2="1920" y2="660" stroke="#FFF" stroke-opacity="0.3" stroke-width="4"/>

  <!-- Left Veggies/Garnish (Cauliflower, Capsicum) -->
  <g transform="translate(40, 500)" filter="url(#dropShadow)">
    <circle cx="60" cy="120" r="70" fill="#2E7D32" opacity="0.85"/>
    <circle cx="100" cy="130" r="60" fill="#4CAF50"/>
    <ellipse cx="140" cy="150" rx="60" ry="70" fill="#F4F4F4"/>
    <ellipse cx="150" cy="170" rx="40" ry="40" fill="#FFF"/>
    <ellipse cx="20" cy="210" rx="55" ry="65" fill="#FFB300"/>
    <ellipse cx="170" cy="220" rx="50" ry="45" fill="#D32F2F"/>
  </g>

  <!-- Central Main Brand Logo: Harwalkart KitchenShakthi -->
  <g transform="translate(960, 400)" text-anchor="middle" filter="url(#dropShadow)">
    <!-- Harwalkart Top Logo -->
    <g transform="translate(0, -90)">
      <text x="0" y="0" font-family="'Plus Jakarta Sans', 'Arial Black', sans-serif" font-size="88" font-weight="900" fill="url(#goldGrad)" stroke="#111" stroke-width="8" paint-order="stroke fill" letter-spacing="-1">
        Harwalkart
      </text>
    </g>

    <!-- Main KitchenShakthi Logo -->
    <g transform="translate(0, 70)">
      <!-- Kitchen (Bold Metallic Black) -->
      <text x="-270" y="0" font-family="'Playfair Display', 'Georgia', serif" font-size="160" font-weight="900" fill="url(#blackMetalGrad)" stroke="#FFFFFF" stroke-width="6" paint-order="stroke fill" filter="url(#dropShadow)">
        Kitchen
      </text>
      <!-- Shakthi (Bold Vibrant 3D Gold with Red Glow) -->
      <text x="230" y="0" font-family="'Playfair Display', 'Georgia', serif" font-size="160" font-weight="900" fill="url(#goldGrad)" stroke="#8B0000" stroke-width="8" paint-order="stroke fill">
        Shakthi
      </text>
      <!-- Cooking Pot / Spoon Icon Badge -->
      <g transform="translate(460, -110)">
        <ellipse cx="40" cy="40" rx="42" ry="28" fill="#111" stroke="#FFB300" stroke-width="6"/>
        <rect x="15" y="10" width="50" height="8" rx="4" fill="#FFB300"/>
        <path d="M 65 30 L 95 10 L 105 20 L 75 40 Z" fill="#FFE144" stroke="#8B0000" stroke-width="2"/>
        <path d="M 5 30 L 75 55 L 70 65 L 0 40 Z" fill="#FF3333"/>
      </g>
    </g>
  </g>

  <!-- 4 Flagship Spice Stand-up Pouches (Left Side Table) -->
  <!-- 1. Garam Masala Pouch (Black / Gold) -->
  <g transform="translate(60, 620)" filter="url(#dropShadow)">
    <rect x="0" y="0" width="220" height="380" rx="16" fill="#1A1A1A" stroke="#FFB300" stroke-width="5"/>
    <rect x="10" y="10" width="200" height="40" rx="6" fill="#0A0A0A"/>
    <text x="110" y="34" font-family="sans-serif" font-size="16" font-weight="900" fill="#FFB300" text-anchor="middle">HARWALKART</text>
    <text x="110" y="70" font-family="'Playfair Display', serif" font-size="20" font-weight="900" fill="#FFF" text-anchor="middle">KitchenShakthi</text>
    <rect x="15" y="85" width="190" height="42" rx="6" fill="#8C5828"/>
    <text x="110" y="112" font-family="sans-serif" font-size="18" font-weight="900" fill="#FFF" text-anchor="middle">GARAM MASALA</text>
    <!-- Spice Bowl Graphic -->
    <ellipse cx="110" cy="220" rx="75" ry="45" fill="#4A2600" stroke="#FFB300" stroke-width="3"/>
    <ellipse cx="110" cy="210" rx="65" ry="35" fill="#783F04"/>
    <text x="110" y="345" font-family="sans-serif" font-size="14" font-weight="800" fill="#FFB300" text-anchor="middle">Taste • Tradition • Trust</text>
  </g>

  <!-- 2. Pure Turmeric Pouch (Yellow / Gold) -->
  <g transform="translate(290, 625)" filter="url(#dropShadow)">
    <rect x="0" y="0" width="220" height="380" rx="16" fill="url(#turmericGrad)" stroke="#FFE082" stroke-width="5"/>
    <rect x="10" y="10" width="200" height="40" rx="6" fill="#111"/>
    <text x="110" y="34" font-family="sans-serif" font-size="16" font-weight="900" fill="#FFB300" text-anchor="middle">HARWALKART</text>
    <text x="110" y="70" font-family="'Playfair Display', serif" font-size="20" font-weight="900" fill="#111" text-anchor="middle">KitchenShakthi</text>
    <rect x="15" y="85" width="190" height="42" rx="6" fill="#0A0A0A"/>
    <text x="110" y="112" font-family="sans-serif" font-size="18" font-weight="900" fill="#FFE144" text-anchor="middle">PURE TURMERIC</text>
    <!-- Haldi Bowl -->
    <ellipse cx="110" cy="220" rx="75" ry="45" fill="#D97706" stroke="#FFF" stroke-width="3"/>
    <ellipse cx="110" cy="210" rx="65" ry="35" fill="#FBBF24"/>
    <text x="110" y="345" font-family="sans-serif" font-size="14" font-weight="800" fill="#111" text-anchor="middle">Haldi Powder • Salem Pure</text>
  </g>

  <!-- 3. Red Chilli Pouch (Bright Red) -->
  <g transform="translate(520, 620)" filter="url(#dropShadow)">
    <rect x="0" y="0" width="220" height="380" rx="16" fill="url(#redGrad)" stroke="#FFA4A4" stroke-width="5"/>
    <rect x="10" y="10" width="200" height="40" rx="6" fill="#111"/>
    <text x="110" y="34" font-family="sans-serif" font-size="16" font-weight="900" fill="#FFB300" text-anchor="middle">HARWALKART</text>
    <text x="110" y="70" font-family="'Playfair Display', serif" font-size="20" font-weight="900" fill="#FFF" text-anchor="middle">KitchenShakthi</text>
    <rect x="15" y="85" width="190" height="42" rx="6" fill="#FFE144"/>
    <text x="110" y="112" font-family="sans-serif" font-size="20" font-weight="900" fill="#8B0000" text-anchor="middle">RED CHILLI</text>
    <!-- Red Chilli Powder Bowl -->
    <ellipse cx="110" cy="220" rx="75" ry="45" fill="#7F1D1D" stroke="#FFE144" stroke-width="3"/>
    <ellipse cx="110" cy="210" rx="65" ry="35" fill="#DC2626"/>
    <text x="110" y="345" font-family="sans-serif" font-size="14" font-weight="800" fill="#FFF" text-anchor="middle">Guntur Hot • 100% Pure</text>
  </g>

  <!-- 4. Onion Powder Pouch (Earthy Deep Brown) -->
  <g transform="translate(750, 625)" filter="url(#dropShadow)">
    <rect x="0" y="0" width="220" height="380" rx="16" fill="#3E2723" stroke="#D7CCC8" stroke-width="5"/>
    <rect x="10" y="10" width="200" height="40" rx="6" fill="#111"/>
    <text x="110" y="34" font-family="sans-serif" font-size="16" font-weight="900" fill="#FFB300" text-anchor="middle">HARWALKART</text>
    <text x="110" y="70" font-family="'Playfair Display', serif" font-size="20" font-weight="900" fill="#FFF" text-anchor="middle">KitchenShakthi</text>
    <rect x="15" y="85" width="190" height="42" rx="6" fill="#5D4037"/>
    <text x="110" y="112" font-family="sans-serif" font-size="18" font-weight="900" fill="#FFE082" text-anchor="middle">ONION POWDER</text>
    <!-- Onion Powder Bowl -->
    <ellipse cx="110" cy="220" rx="75" ry="45" fill="#4E342E" stroke="#FFF" stroke-width="3"/>
    <ellipse cx="110" cy="210" rx="65" ry="35" fill="#EFEBE9"/>
    <text x="110" y="345" font-family="sans-serif" font-size="14" font-weight="800" fill="#FFE082" text-anchor="middle">Premium Quality Ground</text>
  </g>

  <!-- Right Side: Whole Spices Bowls & Red Chillies Display -->
  <g transform="translate(1080, 640)" filter="url(#dropShadow)">
    <!-- Coriander Seeds Bowl -->
    <ellipse cx="120" cy="120" rx="90" ry="50" fill="#B45309" stroke="#E2E8F0" stroke-width="6"/>
    <ellipse cx="120" cy="110" rx="80" ry="40" fill="#65A30D"/>

    <!-- Haldi Turmeric Root Bowl (Center Prominent) -->
    <ellipse cx="320" cy="150" rx="105" ry="60" fill="#78350F" stroke="#FDE68A" stroke-width="8"/>
    <ellipse cx="320" cy="135" rx="95" ry="50" fill="#F59E0B"/>
    <text x="320" y="145" font-size="32" text-anchor="middle">✨</text>

    <!-- Mirch Powder Bowl -->
    <ellipse cx="560" cy="110" rx="95" ry="55" fill="#991B1B" stroke="#FEE2E2" stroke-width="6"/>
    <ellipse cx="560" cy="100" rx="85" ry="45" fill="#EF4444"/>

    <!-- Jeera Cumin Bowl -->
    <ellipse cx="430" cy="230" rx="90" ry="45" fill="#374151" stroke="#F3F4F6" stroke-width="6"/>
    <ellipse cx="430" cy="220" rx="80" ry="35" fill="#A8A29E"/>

    <!-- Black Pepper Bowl -->
    <ellipse cx="640" cy="240" rx="85" ry="40" fill="#18181B" stroke="#E4E4E7" stroke-width="6"/>
    <ellipse cx="640" cy="230" rx="75" ry="30" fill="#27272A"/>

    <!-- Elaichi Cardamom Bowl -->
    <ellipse cx="230" cy="250" rx="90" ry="40" fill="#14532D" stroke="#DCFCE7" stroke-width="6"/>
    <ellipse cx="230" cy="240" rx="80" ry="30" fill="#4ADE80"/>
  </g>

  <!-- Right Side Fresh Red Tomatoes & Capsicum -->
  <g transform="translate(1680, 560)" filter="url(#dropShadow)">
    <circle cx="80" cy="100" r="70" fill="#DC2626"/>
    <circle cx="160" cy="120" r="65" fill="#EF4444"/>
    <circle cx="120" cy="180" r="70" fill="#B91C1C"/>
    <ellipse cx="30" cy="160" rx="50" ry="60" fill="#15803D"/>
  </g>
</svg>
