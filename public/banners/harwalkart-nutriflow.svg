<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <!-- Background Gradient: Clean Airy Kitchen -->
    <linearGradient id="nutriBgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFDF7"/>
      <stop offset="40%" stop-color="#F5EFE1"/>
      <stop offset="70%" stop-color="#EADDC4"/>
      <stop offset="100%" stop-color="#D9C29D"/>
    </linearGradient>

    <!-- Wood Surface Gradient -->
    <linearGradient id="lightWoodGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#EED9B3"/>
      <stop offset="30%" stop-color="#DEB887"/>
      <stop offset="75%" stop-color="#C59B63"/>
      <stop offset="100%" stop-color="#936D3A"/>
    </linearGradient>

    <!-- NutriFlow Gold & Leaf Green Logo Gradients -->
    <linearGradient id="nutriGoldGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFBEB"/>
      <stop offset="25%" stop-color="#FDE047"/>
      <stop offset="60%" stop-color="#EAB308"/>
      <stop offset="100%" stop-color="#CA8A04"/>
    </linearGradient>

    <linearGradient id="greenLeafGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#86EFAC"/>
      <stop offset="40%" stop-color="#22C55E"/>
      <stop offset="100%" stop-color="#15803D"/>
    </linearGradient>

    <filter id="shadowHeavy" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="3" dy="12" stdDeviation="14" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background Ambient Kitchen Surface -->
  <rect width="1920" height="1080" fill="url(#nutriBgGrad)"/>

  <!-- Kitchen Backdrop Panels -->
  <rect x="0" y="0" width="1920" height="660" fill="#FBF8F0" opacity="0.6"/>
  <rect x="250" y="80" width="600" height="340" rx="16" fill="#F1E7D0" opacity="0.4"/>
  <rect x="1100" y="60" width="650" height="380" rx="16" fill="#EFE3CA" opacity="0.35"/>

  <!-- Wooden Table Board -->
  <rect x="0" y="660" width="1920" height="420" fill="url(#lightWoodGrad)"/>
  <line x1="0" y1="660" x2="1920" y2="660" stroke="#FFF" stroke-opacity="0.4" stroke-width="5"/>

  <!-- Top Right: 4 Super Energy Protein Bars Stack -->
  <g transform="translate(1450, 80)" filter="url(#shadowHeavy)">
    <!-- Almond Bar -->
    <rect x="0" y="0" width="85" height="180" rx="10" fill="#78350F" stroke="#FDE68A" stroke-width="3"/>
    <ellipse cx="42" cy="40" rx="28" ry="16" fill="#F59E0B"/>
    <ellipse cx="42" cy="80" rx="24" ry="14" fill="#D97706"/>
    <ellipse cx="42" cy="120" rx="30" ry="16" fill="#F59E0B"/>

    <!-- Sesame / Quinoa Bar -->
    <rect x="110" y="0" width="85" height="180" rx="10" fill="#E5E7EB" stroke="#D1D5DB" stroke-width="3"/>
    <circle cx="152" cy="50" r="16" fill="#FEF08A"/>
    <circle cx="152" cy="100" r="18" fill="#FDE047"/>
    <circle cx="152" cy="140" r="14" fill="#FEF08A"/>

    <!-- Pumpkin / Seed Bar -->
    <rect x="220" y="0" width="85" height="180" rx="10" fill="#14532D" stroke="#86EFAC" stroke-width="3"/>
    <ellipse cx="262" cy="45" rx="20" ry="32" fill="#22C55E"/>
    <ellipse cx="262" cy="125" rx="22" ry="30" fill="#16A34A"/>

    <!-- Choco Nut Energy Bar -->
    <rect x="330" y="0" width="85" height="180" rx="10" fill="#3B1D0E" stroke="#FBBF24" stroke-width="3"/>
    <rect x="340" y="20" width="65" height="30" rx="4" fill="#B45309"/>
    <rect x="340" y="70" width="65" height="30" rx="4" fill="#D97706"/>
    <rect x="340" y="120" width="65" height="30" rx="4" fill="#92400E"/>

    <!-- Large Multi-Grain Bar (Diagonal) -->
    <g transform="translate(130, 230) rotate(22)">
      <rect x="0" y="0" width="95" height="210" rx="12" fill="#7C2D12" stroke="#FDE047" stroke-width="4"/>
      <circle cx="47" cy="40" r="16" fill="#EF4444"/>
      <circle cx="47" cy="90" r="18" fill="#F59E0B"/>
      <circle cx="47" cy="140" r="14" fill="#84CC16"/>
    </g>
  </g>

  <!-- Central Logo: Harwalkart NutriFlow -->
  <g transform="translate(960, 360)" text-anchor="middle" filter="url(#shadowHeavy)">
    <!-- Harwalkart Top -->
    <g transform="translate(0, -110)">
      <text x="0" y="0" font-family="'Plus Jakarta Sans', sans-serif" font-size="80" font-weight="900" fill="#15803D" stroke="#FFFFFF" stroke-width="8" paint-order="stroke fill">
        Harwalkart
      </text>
    </g>

    <!-- Wheat Circle + NutriFlow Main -->
    <g transform="translate(0, 50)">
      <!-- Wheat Ring Emblem (Left) -->
      <g transform="translate(-460, -90)">
        <path d="M 120 180 C 40 180 10 110 30 50 C 50 -10 130 -40 180 20 C 130 0 70 40 60 90 C 50 140 90 170 140 170 Z" fill="url(#nutriGoldGrad)" stroke="#B45309" stroke-width="4"/>
        <path d="M 80 50 C 40 90 60 150 110 160 C 100 130 110 90 140 70 Z" fill="url(#greenLeafGrad)"/>
      </g>

      <!-- Nutri (White 3D Outline) -->
      <text x="-160" y="10" font-family="'Plus Jakarta Sans', sans-serif" font-size="165" font-weight="900" fill="#FFFFFF" stroke="#222222" stroke-width="12" paint-order="stroke fill" letter-spacing="-2">
        Nutri
      </text>
      <!-- Flow (Golden 3D with Leaves) -->
      <text x="210" y="10" font-family="'Plus Jakarta Sans', sans-serif" font-size="165" font-weight="900" fill="url(#nutriGoldGrad)" stroke="#78350F" stroke-width="10" paint-order="stroke fill" letter-spacing="-2">
        Flow
      </text>
      <text x="440" y="-80" font-family="sans-serif" font-size="34" font-weight="900" fill="#CA8A04">TM</text>
    </g>
  </g>

  <!-- 7 Standing Wooden Spoons Filled with Pulses & Dals (Row on Table) -->
  <!-- Spoon 1: Pinto / Rajma Beans -->
  <g transform="translate(420, 540)" filter="url(#shadowHeavy)">
    <rect x="25" y="150" width="20" height="280" rx="6" fill="#8C5828" stroke="#5D3A1A" stroke-width="2"/>
    <ellipse cx="35" cy="90" rx="55" ry="85" fill="#A0522D" stroke="#5D3A1A" stroke-width="5"/>
    <ellipse cx="35" cy="85" rx="46" ry="74" fill="#FEE2E2"/>
    <circle cx="25" cy="70" r="10" fill="#991B1B"/>
    <circle cx="45" cy="85" r="12" fill="#7F1D1D"/>
    <circle cx="30" cy="110" r="11" fill="#991B1B"/>
  </g>

  <!-- Spoon 2: Black-Eye / Kidney Beans -->
  <g transform="translate(600, 540)" filter="url(#shadowHeavy)">
    <rect x="25" y="150" width="20" height="280" rx="6" fill="#8C5828" stroke="#5D3A1A" stroke-width="2"/>
    <ellipse cx="35" cy="90" rx="55" ry="85" fill="#A0522D" stroke="#5D3A1A" stroke-width="5"/>
    <ellipse cx="35" cy="85" rx="46" ry="74" fill="#262626"/>
    <circle cx="25" cy="70" r="10" fill="#78350F"/>
    <circle cx="45" cy="85" r="12" fill="#0A0A0A"/>
    <circle cx="30" cy="110" r="11" fill="#78350F"/>
  </g>

  <!-- Spoon 3: White Navy / Kabuli Chana Beans -->
  <g transform="translate(780, 540)" filter="url(#shadowHeavy)">
    <rect x="25" y="150" width="20" height="280" rx="6" fill="#8C5828" stroke="#5D3A1A" stroke-width="2"/>
    <ellipse cx="35" cy="90" rx="55" ry="85" fill="#A0522D" stroke="#5D3A1A" stroke-width="5"/>
    <ellipse cx="35" cy="85" rx="46" ry="74" fill="#FAFAFA"/>
    <circle cx="25" cy="70" r="11" fill="#E5E5E5"/>
    <circle cx="45" cy="85" r="12" fill="#D4D4D4"/>
    <circle cx="30" cy="110" r="11" fill="#E5E5E5"/>
  </g>

  <!-- Spoon 4: Whole Green Moong Dal -->
  <g transform="translate(960, 540)" filter="url(#shadowHeavy)">
    <rect x="25" y="150" width="20" height="280" rx="6" fill="#8C5828" stroke="#5D3A1A" stroke-width="2"/>
    <ellipse cx="35" cy="90" rx="55" ry="85" fill="#A0522D" stroke="#5D3A1A" stroke-width="5"/>
    <ellipse cx="35" cy="85" rx="46" ry="74" fill="#15803D"/>
    <circle cx="25" cy="70" r="8" fill="#4ADE80"/>
    <circle cx="45" cy="85" r="9" fill="#166534"/>
    <circle cx="30" cy="110" r="8" fill="#22C55E"/>
  </g>

  <!-- Spoon 5: Black Urad Dal / Beans -->
  <g transform="translate(1140, 540)" filter="url(#shadowHeavy)">
    <rect x="25" y="150" width="20" height="280" rx="6" fill="#8C5828" stroke="#5D3A1A" stroke-width="2"/>
    <ellipse cx="35" cy="90" rx="55" ry="85" fill="#A0522D" stroke="#5D3A1A" stroke-width="5"/>
    <ellipse cx="35" cy="85" rx="46" ry="74" fill="#171717"/>
    <circle cx="25" cy="70" r="8" fill="#404040"/>
    <circle cx="45" cy="85" r="9" fill="#0A0A0A"/>
    <circle cx="30" cy="110" r="8" fill="#262626"/>
  </g>

  <!-- Spoon 6: Red Kidney Beans (Rajma) -->
  <g transform="translate(1320, 540)" filter="url(#shadowHeavy)">
    <rect x="25" y="150" width="20" height="280" rx="6" fill="#8C5828" stroke="#5D3A1A" stroke-width="2"/>
    <ellipse cx="35" cy="90" rx="55" ry="85" fill="#A0522D" stroke="#5D3A1A" stroke-width="5"/>
    <ellipse cx="35" cy="85" rx="46" ry="74" fill="#991B1B"/>
    <circle cx="25" cy="70" r="10" fill="#DC2626"/>
    <circle cx="45" cy="85" r="11" fill="#7F1D1D"/>
    <circle cx="30" cy="110" r="10" fill="#B91C1C"/>
  </g>

  <!-- Spoon 7: Black Eyed Peas (Lobia) -->
  <g transform="translate(1500, 540)" filter="url(#shadowHeavy)">
    <rect x="25" y="150" width="20" height="280" rx="6" fill="#8C5828" stroke="#5D3A1A" stroke-width="2"/>
    <ellipse cx="35" cy="90" rx="55" ry="85" fill="#A0522D" stroke="#5D3A1A" stroke-width="5"/>
    <ellipse cx="35" cy="85" rx="46" ry="74" fill="#FEF3C7"/>
    <circle cx="25" cy="70" r="9" fill="#111"/>
    <circle cx="45" cy="85" r="9" fill="#111"/>
    <circle cx="30" cy="110" r="8" fill="#111"/>
  </g>

  <!-- Heap of Whole Grains, Toor Dal & Chana Dal (Bottom Spills on Table) -->
  <g transform="translate(40, 770)" filter="url(#shadowHeavy)">
    <ellipse cx="140" cy="130" rx="140" ry="60" fill="#D97706"/>
    <ellipse cx="480" cy="130" rx="160" ry="65" fill="#FACC15"/>
    <ellipse cx="780" cy="130" rx="110" ry="50" fill="#F59E0B"/>
    <ellipse cx="1060" cy="130" rx="150" ry="60" fill="#FEF08A"/>
    <ellipse cx="1320" cy="130" rx="120" ry="55" fill="#22C55E"/>
    <ellipse cx="1640" cy="130" rx="140" ry="60" fill="#B91C1C"/>
  </g>
</svg>
