<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <!-- Warm Autumn Sunset / Forest Gradient -->
    <linearGradient id="autumnGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#C2410C"/>
      <stop offset="35%" stop-color="#EA580C"/>
      <stop offset="65%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#FEF3C7"/>
    </linearGradient>

    <!-- Wood Counter -->
    <linearGradient id="darkWoodGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#C89D6A"/>
      <stop offset="25%" stop-color="#A27142"/>
      <stop offset="75%" stop-color="#73431D"/>
      <stop offset="100%" stop-color="#45230A"/>
    </linearGradient>

    <!-- RupaBhoom Magenta / Pink Gradient -->
    <linearGradient id="pinkBhoomGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FDF2F8"/>
      <stop offset="30%" stop-color="#F472B6"/>
      <stop offset="70%" stop-color="#DB2777"/>
      <stop offset="100%" stop-color="#9D174D"/>
    </linearGradient>

    <filter id="beautyShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="3" dy="12" stdDeviation="14" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Autumn Forest Background -->
  <rect width="1920" height="1080" fill="url(#autumnGrad)"/>

  <!-- Autumn Maple & Oak Leaves (Top Ambient) -->
  <g opacity="0.9" filter="url(#beautyShadow)">
    <!-- Big Autumn Maple Leaves (Top Left) -->
    <path d="M 0 0 L 280 60 L 320 220 L 190 320 L 140 440 L 0 340 Z" fill="#991B1B"/>
    <path d="M 120 0 L 380 90 L 460 260 L 310 390 L 220 520 L 60 410 Z" fill="#D97706"/>
    <path d="M 300 0 L 580 40 L 680 180 L 590 310 L 480 340 L 280 210 Z" fill="#B45309"/>

    <!-- Autumn Leaves (Top Right) -->
    <path d="M 1920 0 L 1600 40 L 1480 190 L 1620 310 L 1800 380 L 1920 240 Z" fill="#991B1B"/>
    <path d="M 1750 0 L 1420 80 L 1320 260 L 1480 380 L 1700 450 L 1920 360 Z" fill="#D97706"/>
  </g>

  <!-- Wooden Surface -->
  <rect x="0" y="740" width="1920" height="340" fill="url(#darkWoodGrad)"/>
  <line x1="0" y1="740" x2="1920" y2="740" stroke="#FFF" stroke-opacity="0.4" stroke-width="4"/>

  <!-- Center Logo: Harwalkart RupaBhoom -->
  <g transform="translate(960, 440)" text-anchor="middle" filter="url(#beautyShadow)">
    <!-- Harwalkart Top -->
    <g transform="translate(0, -90)">
      <text x="0" y="0" font-family="'Plus Jakarta Sans', sans-serif" font-size="80" font-weight="900" fill="#FFB300" stroke="#111" stroke-width="8" paint-order="stroke fill">
        Harwalkart
      </text>
    </g>

    <!-- RupaBhoom Main -->
    <g transform="translate(0, 70)">
      <!-- Green Leaf Motif (Left) -->
      <g transform="translate(-480, -90)">
        <path d="M 110 160 C 30 150 10 90 40 40 C 70 -10 140 10 160 70 C 130 50 80 70 70 110 C 60 140 80 150 110 160 Z" fill="#22C55E" stroke="#15803D" stroke-width="4"/>
        <path d="M 70 40 C 20 80 40 140 90 140 C 70 110 80 70 110 50 Z" fill="#86EFAC"/>
      </g>

      <!-- Rupa (Pure White 3D) -->
      <text x="-210" y="0" font-family="'Plus Jakarta Sans', sans-serif" font-size="160" font-weight="900" fill="#FFFFFF" stroke="#111111" stroke-width="12" paint-order="stroke fill">
        Rupa
      </text>
      <!-- Bhoom (Vibrant Magenta Pink 3D) -->
      <text x="210" y="0" font-family="'Plus Jakarta Sans', sans-serif" font-size="160" font-weight="900" fill="url(#pinkBhoomGrad)" stroke="#111111" stroke-width="12" paint-order="stroke fill">
        bhoom
      </text>
      <text x="510" y="-80" font-family="sans-serif" font-size="34" font-weight="900" fill="#111">TM</text>
    </g>
  </g>

  <!-- Left Side: Herbal Oils, Amber Dropper Bottles, Honey & Ayurvedic Soaps -->
  <g transform="translate(60, 600)" filter="url(#beautyShadow)">
    <!-- Wooden Herbal Brush & Soap Stack -->
    <g transform="translate(0, 100)">
      <rect x="0" y="0" width="130" height="40" rx="8" fill="#FBBF24"/>
      <rect x="0" y="45" width="130" height="40" rx="8" fill="#F59E0B"/>
      <rect x="5" y="-35" width="120" height="30" rx="6" fill="#D97706"/>
    </g>

    <!-- Glass Jar with Kraft Paper Label -->
    <g transform="translate(70, 160)">
      <rect x="0" y="0" width="110" height="130" rx="14" fill="#3E2723" stroke="#271915" stroke-width="3"/>
      <rect x="0" y="30" width="110" height="60" fill="#D7CCC8"/>
      <rect x="10" y="-15" width="90" height="15" rx="4" fill="#111"/>
    </g>

    <!-- Large Amber Dropper Bottle (Kumkumadi Oil) -->
    <g transform="translate(160, 50)">
      <rect x="0" y="40" width="105" height="250" rx="20" fill="#B45309" stroke="#78350F" stroke-width="4"/>
      <rect x="25" y="0" width="55" height="40" rx="6" fill="#D97706"/>
      <ellipse cx="52" cy="-10" rx="20" ry="15" fill="#1E293B"/>
    </g>

    <!-- Second Amber Dropper Bottle (Bhringraj Hair Oil) -->
    <g transform="translate(260, 0)">
      <rect x="0" y="40" width="115" height="300" rx="24" fill="#D97706" stroke="#92400E" stroke-width="4"/>
      <rect x="30" y="0" width="55" height="40" rx="6" fill="#B45309"/>
      <ellipse cx="57" cy="-10" rx="22" ry="16" fill="#0F172A"/>
    </g>

    <!-- Honey / Ayurvedic Herb Bowl with Wooden Dipper -->
    <g transform="translate(370, 170)">
      <ellipse cx="70" cy="90" rx="80" ry="45" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="4"/>
      <ellipse cx="70" cy="80" rx="68" ry="35" fill="#F59E0B"/>
      <!-- Wooden Dipper Handle -->
      <line x1="0" y1="40" x2="80" y2="85" stroke="#78350F" stroke-width="12" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Center-Right: Luxury Minimalist White Bottles & Cream Jars -->
  <g transform="translate(680, 640)" filter="url(#beautyShadow)">
    <!-- Open Cream Jar with Lid Off -->
    <g transform="translate(0, 170)">
      <rect x="0" y="20" width="140" height="90" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="3"/>
      <ellipse cx="70" cy="20" rx="70" ry="20" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="3"/>
      <!-- Leaning Lid -->
      <ellipse cx="-20" cy="50" rx="45" ry="45" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="4"/>
    </g>

    <!-- White Lotion Bottle (Curved) -->
    <g transform="translate(170, 70)">
      <rect x="0" y="20" width="105" height="230" rx="35" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="4"/>
      <rect x="25" y="0" width="55" height="20" rx="4" fill="#F1F5F9"/>
    </g>

    <!-- White Pump Dispenser Bottle -->
    <g transform="translate(300, 50)">
      <rect x="0" y="40" width="100" height="250" rx="20" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="4"/>
      <rect x="35" y="10" width="30" height="30" fill="#CBD5E1"/>
      <path d="M 10 10 L 65 10 L 65 0 L 25 0 Z" fill="#94A3B8"/>
    </g>

    <!-- White Squeeze Tube (Face Wash) -->
    <g transform="translate(420, 90)">
      <path d="M 10 0 L 95 0 L 80 210 L 25 210 Z" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="4"/>
      <rect x="20" y="210" width="65" height="30" rx="6" fill="#F1F5F9"/>
    </g>

    <!-- White Serum Pump Bottle -->
    <g transform="translate(540, 80)">
      <rect x="0" y="40" width="100" height="220" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="4"/>
      <rect x="35" y="10" width="30" height="30" fill="#CBD5E1"/>
      <path d="M 10 10 L 65 10 L 65 0 L 25 0 Z" fill="#94A3B8"/>
    </g>

    <!-- Slim Lip / Eye Dropper Vial -->
    <g transform="translate(670, 150)">
      <rect x="0" y="0" width="48" height="150" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="3"/>
    </g>
  </g>

  <!-- Far Right: Ayurvedic Ubtan Scrub Bowl & Luxury Amber Bottle with Arch Decor -->
  <g transform="translate(1500, 520)" filter="url(#beautyShadow)">
    <!-- Modern Boho Arch Aesthetic Decor -->
    <path d="M 40 400 L 40 180 A 90 90 0 0 1 220 180 L 220 400 Z" fill="#E7E5E4" stroke="#D6D3D1" stroke-width="4"/>
    
    <!-- Amber Bottle with Pump -->
    <g transform="translate(30, 110)">
      <rect x="0" y="40" width="120" height="270" rx="24" fill="#78350F" stroke="#451A03" stroke-width="4"/>
      <rect x="20" y="80" width="80" height="110" rx="6" fill="#F5F5F4"/>
      <rect x="45" y="10" width="30" height="30" fill="#0F172A"/>
      <path d="M 15 10 L 75 10 L 75 0 L 35 0 Z" fill="#0F172A"/>
    </g>

    <!-- Night Cream Jar & Pearl Accents -->
    <g transform="translate(150, 240)">
      <rect x="0" y="20" width="110" height="110" rx="16" fill="#3B1D0E" stroke="#1C0A00" stroke-width="3"/>
      <rect x="10" y="0" width="90" height="20" rx="4" fill="#1C0A00"/>
      <!-- Glowing Pearl Spheres -->
      <circle cx="-15" cy="110" r="30" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="3"/>
      <circle cx="120" cy="80" r="45" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="4"/>
    </g>
  </g>
</svg>
