<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="favPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D0A4E" />
      <stop offset="100%" stop-color="#4A0E4E" />
    </linearGradient>
    <linearGradient id="favGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFB800" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
  </defs>

  <rect width="128" height="128" rx="28" fill="#0F172A" />

  <!-- H Stylized Initial with Swoosh and Cart -->
  <g transform="translate(14, 18) scale(0.78)">
    <!-- Left vertical bar -->
    <rect x="14" y="24" width="22" height="72" rx="10" fill="#FFFFFF" />
    <!-- Right vertical bar -->
    <rect x="52" y="24" width="22" height="72" rx="10" fill="url(#favGold)" />

    <!-- Purple Crescent -->
    <path d="M 6 72 C 22 56, 48 54, 76 86 C 58 64, 34 60, 14 74 Z" fill="url(#favPurple)" />

    <!-- Golden Swoosh Arch -->
    <path d="M 6 72 C 18 46, 50 44, 88 68 C 76 60, 60 52, 48 50 C 26 48, 12 62, 6 72 Z" fill="url(#favGold)" />

    <!-- Cart Mini Accent -->
    <g transform="translate(68, 12) scale(0.65)">
      <path d="M 10 10 L 22 36 L 68 36 L 60 62 L 28 62" fill="none" stroke="url(#favGold)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
      <circle cx="34" cy="74" r="7" fill="url(#favGold)" />
      <circle cx="34" cy="74" r="3" fill="#0F172A" />
      <circle cx="56" cy="74" r="7" fill="url(#favGold)" />
      <circle cx="56" cy="74" r="3" fill="#0F172A" />
    </g>
  </g>
</svg>
