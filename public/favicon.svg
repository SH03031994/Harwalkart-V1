<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="favPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#26023B" />
      <stop offset="100%" stop-color="#4F0A6B" />
    </linearGradient>
    <linearGradient id="favGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFB800" />
      <stop offset="100%" stop-color="#FFAA00" />
    </linearGradient>
  </defs>

  <rect width="128" height="128" rx="28" fill="#000000" />

  <!-- H Stylized Initial with Swoosh, Cart & Bottom Smile Curve -->
  <g transform="translate(14, 18) scale(0.78)">
    <!-- Left vertical bar (White) -->
    <rect x="14" y="24" width="22" height="72" rx="9" fill="#FFFFFF" />
    <!-- Right vertical bar (Gold) -->
    <rect x="52" y="24" width="22" height="72" rx="9" fill="url(#favGold)" />

    <!-- Purple Crescent -->
    <path d="M 6 72 C 22 56, 48 54, 76 86 C 58 64, 34 60, 14 74 Z" fill="url(#favPurple)" />

    <!-- Golden Swoosh Arch -->
    <path d="M 6 72 C 18 46, 50 44, 88 68 C 76 60, 60 52, 48 50 C 26 48, 12 62, 6 72 Z" fill="url(#favGold)" />

    <!-- Mini Bottom Smile Arc -->
    <path d="M 20 98 C 45 116, 75 116, 106 94 C 75 122, 45 122, 20 98 Z" fill="url(#favGold)" />

    <!-- Speed Shopping Cart Accent -->
    <g transform="translate(66, 14) scale(0.68)">
      <!-- Speed lines -->
      <line x1="2" y1="36" x2="16" y2="36" stroke="url(#favGold)" stroke-width="4" stroke-linecap="round" />
      <line x1="6" y1="44" x2="18" y2="44" stroke="url(#favGold)" stroke-width="4" stroke-linecap="round" />
      
      <!-- Cart body -->
      <path d="M 8 12 L 20 38 L 66 38 L 58 64 L 26 64" fill="none" stroke="url(#favGold)" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round" />
      <line x1="22" y1="51" x2="60" y2="51" stroke="url(#favGold)" stroke-width="4.5" stroke-linecap="round" />
      
      <!-- Wheels -->
      <circle cx="34" cy="74" r="7" fill="url(#favGold)" />
      <circle cx="34" cy="74" r="2.8" fill="#000000" />
      <circle cx="54" cy="74" r="7" fill="url(#favGold)" />
      <circle cx="54" cy="74" r="2.8" fill="#000000" />
    </g>
  </g>
</svg>
